<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#0b0a10"
  />


  <!-- =====================================================
       BASIC
  ====================================================== -->

  <title>Midnight Hour</title>

  <meta
    name="description"
    content="자정의 시간"
  />


  <!-- =====================================================
       FAVICON
  ====================================================== -->

  <link
    rel="icon"
    type="image/x-icon"
    href="/favicon.ico"
  />

  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="/favicon.ico"
  />


  <!-- =====================================================
       CANONICAL
  ====================================================== -->

  <link
    rel="canonical"
    href="https://midnight-h0ur.vercel.app/"
  />


  <!-- =====================================================
       OPEN GRAPH
       Discord / KakaoTalk / 기타 SNS
  ====================================================== -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="Midnight Hour"
  />

  <meta
    property="og:title"
    content="Midnight Hour"
  />

  <meta
    property="og:description"
    content="자정의 시간"
  />

  <meta
    property="og:url"
    content="https://midnight-h0ur.vercel.app/"
  />

  <meta
    property="og:image"
    content="https://midnight-h0ur.vercel.app/preview.jpg"
  />

  <meta
    property="og:image:secure_url"
    content="https://midnight-h0ur.vercel.app/preview.jpg"
  />

  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:image:alt"
    content="Midnight Hour — 자정의 시간"
  />


  <!-- =====================================================
       X / TWITTER CARD
  ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Midnight Hour"
  />

  <meta
    name="twitter:description"
    content="자정의 시간"
  />

  <meta
    name="twitter:image"
    content="https://midnight-h0ur.vercel.app/preview.jpg"
  />

  <meta
    name="twitter:image:alt"
    content="Midnight Hour — 자정의 시간"
  />


  <style>

    @font-face {
      font-family: "GmarketSans";

      src:
        url("./GmarketSansTTFLight.ttf")
        format("truetype");

      font-weight: 300;

      font-style: normal;

      font-display: swap;
    }


    :root {
      --bg: #0b0a10;

      --panel: #111016;

      --text: #f1f0f5;

      --violet: #9c86ff;

      --violet-light: #bcaeff;

      --radius: 25px;
    }


    * {
      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      min-height: 100vh;

      overflow-x: hidden;

      color: var(--text);

      font-family:
        "GmarketSans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-weight: 300;

      background:

        radial-gradient(
          circle at 6% 1%,
          rgba(100,105,174,.12),
          transparent 30%
        ),

        radial-gradient(
          circle at 94% 60%,
          rgba(114,72,147,.08),
          transparent 28%
        ),

        var(--bg);
    }


    a {
      color: inherit;

      text-decoration: none;
    }


    button {
      font: inherit;
    }


    img {
      display: block;
    }


    /* =====================================================
       PAGE
    ====================================================== */

    .mh-home {
      width:
        min(
          1500px,
          calc(100% - 64px)
        );

      margin:
        0 auto;

      padding:
        44px
        0
        115px;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .mh-home-header {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 40px;

      margin-bottom: 36px;
    }


    .mh-home-title {
      margin: 0;

      color: #f2f1f6;

      font-size:
        clamp(
          55px,
          7vw,
          112px
        );

      font-weight: 300;

      line-height: .87;

      letter-spacing: -.068em;
    }


    .mh-home-subtitle {
      margin-top: 16px;

      color:
        rgba(178,166,226,.67);

      font-size: 11px;

      letter-spacing: .20em;
    }


    .mh-home-track {
      display: flex;

      align-items: center;

      gap: 10px;

      padding-bottom: 8px;

      color:
        rgba(255,255,255,.56);

      font-size: 11px;

      white-space: nowrap;
    }


    .mh-home-track-icon {
      color:
        var(--violet-light);

      font-size: 14px;
    }


    /* =====================================================
       GRID
    ====================================================== */

    .mh-home-grid {
      display: grid;

      grid-template-columns:
        1.05fr
        1.15fr
        .82fr;

      grid-template-rows:
        minmax(370px, 46vh)
        minmax(345px, 42vh);

      gap: 15px;
    }


    /* =====================================================
       CARD
    ====================================================== */

    .mh-home-card {
      position: relative;

      display: block;

      overflow: hidden;

      border-radius:
        var(--radius);

      background:
        var(--panel);

      isolation: isolate;
    }


    .mh-home-card img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform .72s cubic-bezier(.18,.78,.22,1),
        filter .45s ease;
    }


    .mh-home-card::before {
      content: "";

      position: absolute;

      z-index: 2;

      inset: 0;

      pointer-events: none;

      background:

        linear-gradient(
          to top,
          rgba(5,5,9,.84) 0%,
          rgba(5,5,9,.12) 42%,
          transparent 68%
        );

      opacity: .38;

      transition:
        opacity .35s ease;
    }


    .mh-home-card::after {
      content: "";

      position: absolute;

      z-index: 3;

      inset: 0;

      pointer-events: none;

      border:
        1px solid
        rgba(255,255,255,.055);

      border-radius: inherit;
    }


    .mh-home-card:hover img {
      transform:
        scale(1.025);

      filter:
        brightness(.74);
    }


    .mh-home-card:hover::before {
      opacity: .95;
    }


    /* =====================================================
       GRID POSITION

       PERSONNEL  | PERSONNEL | STILLS
       FRAGMENTS  | TIMELINE  | STILLS
    ====================================================== */

    .mh-card-personnel {
      grid-column:
        1 / 3;

      grid-row:
        1;
    }


    .mh-card-fragments {
      grid-column:
        1;

      grid-row:
        2;
    }


    .mh-card-timeline {
      grid-column:
        2;

      grid-row:
        2;
    }


    .mh-card-stills {
      grid-column:
        3;

      grid-row:
        1 / 3;
    }


    /* =====================================================
       IMAGE POSITION
    ====================================================== */

    .mh-card-personnel img {
      object-position:
        center 42%;
    }


    .mh-card-fragments img {
      object-position:
        center center;
    }


    .mh-card-timeline img {
      object-position:
        center 30%;
    }


    .mh-card-stills img {
      object-position:
        center center;
    }


    /* =====================================================
       CARD TEXT
    ====================================================== */

    .mh-card-content {
      position: absolute;

      z-index: 5;

      left: 25px;
      right: 25px;
      bottom: 23px;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 24px;

      pointer-events: none;

      transition:
        transform .32s ease;
    }


    .mh-home-card:hover
    .mh-card-content {
      transform:
        translateY(-3px);
    }


    .mh-card-number {
      margin-bottom: 7px;

      color:
        #aa9bf0;

      font-size: 9px;

      letter-spacing: .23em;
    }


    .mh-card-title {
      color: white;

      font-size:
        clamp(
          20px,
          2.3vw,
          33px
        );

      line-height: 1;

      letter-spacing: -.045em;
    }


    .mh-card-desc {
      overflow: hidden;

      max-height: 0;

      margin-top: 0;

      opacity: 0;

      color:
        rgba(255,255,255,.58);

      font-size: 10px;

      letter-spacing: .08em;

      transition:
        opacity .3s ease,
        max-height .3s ease,
        margin .3s ease;
    }


    .mh-home-card:hover
    .mh-card-desc {
      max-height: 28px;

      margin-top: 8px;

      opacity: 1;
    }


    .mh-card-arrow {
      width: 40px;
      height: 40px;

      flex:
        0
        0
        auto;

      display: grid;

      place-items: center;

      border:
        1px solid
        rgba(255,255,255,.34);

      border-radius: 50%;

      color: white;

      transition:
        transform .3s ease,
        background .3s ease,
        color .3s ease;
    }


    .mh-home-card:hover
    .mh-card-arrow {
      transform:
        rotate(45deg);

      background:
        rgba(255,255,255,.94);

      color:
        #15131b;
    }


    /* =====================================================
       MUSIC PLAYER
    ====================================================== */

    .music-player {
      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 17px;

      transform:
        translateX(-50%);

      width:
        min(
          660px,
          calc(100% - 36px)
        );

      min-height: 61px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      padding:
        9px
        13px
        9px
        19px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 999px;

      background:
        rgba(20,18,29,.89);

      box-shadow:
        0
        15px
        43px
        rgba(0,0,0,.32);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    .music-left,
    .music-controls {
      display: flex;

      align-items: center;
    }


    .music-left {
      min-width: 0;

      gap: 11px;
    }


    .music-icon {
      color:
        #a998ff;

      font-size: 17px;
    }


    .music-title {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      color:
        rgba(255,255,255,.73);

      font-size: 11px;
    }


    .music-controls {
      flex:
        0
        0
        auto;

      gap: 3px;
    }


    .music-btn {
      width: 39px;
      height: 39px;

      display: grid;

      place-items: center;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,.14);

      border-radius: 50%;

      color: white;

      background:
        rgba(255,255,255,.045);

      cursor: pointer;
    }


    .music-btn.small {
      width: 31px;
      height: 31px;

      border: 0;

      background: transparent;

      color:
        rgba(255,255,255,.55);

      font-size: 17px;
    }


    /* =====================================================
       TABLET
    ====================================================== */

    @media (max-width: 950px) {

      .mh-home {
        width:
          calc(100% - 36px);
      }


      .mh-home-grid {
        grid-template-columns:
          1fr
          1fr;

        grid-template-rows:
          430px
          360px
          500px;
      }


      .mh-card-personnel {
        grid-column:
          1 / 3;

        grid-row:
          1;
      }


      .mh-card-fragments {
        grid-column:
          1;

        grid-row:
          2;
      }


      .mh-card-timeline {
        grid-column:
          2;

        grid-row:
          2;
      }


      .mh-card-stills {
        grid-column:
          1 / 3;

        grid-row:
          3;
      }

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 620px) {

      .mh-home {
        width:
          calc(100% - 24px);

        padding-top:
          28px;
      }


      .mh-home-header {
        flex-direction:
          column;

        align-items:
          flex-start;

        gap: 18px;

        margin-bottom:
          24px;
      }


      .mh-home-title {
        font-size:
          15vw;
      }


      .mh-home-grid {
        display: flex;

        flex-direction:
          column;

        gap: 11px;
      }


      .mh-home-card {
        height:
          48vh;

        min-height:
          330px;

        border-radius:
          19px;
      }


      .mh-card-personnel {
        height:
          43vh;
      }


      .mh-card-stills {
        height:
          66vh;
      }


      .mh-card-desc {
        max-height:
          30px;

        margin-top:
          7px;

        opacity:
          .7;
      }

    }

  </style>

</head>


<body>


<main
  class="mh-home"
  id="home"
>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="mh-home-header">


    <div>

      <h1 class="mh-home-title">
        Midnight Hour
      </h1>

      <div class="mh-home-subtitle">
        자정의 시간
      </div>

    </div>


    <div class="mh-home-track">

      <span class="mh-home-track-icon">
        ♪
      </span>

      <span>
        긴 밤(feat. 기리보이) — Seori
      </span>

    </div>


  </header>



  <!-- =====================================================
       CATEGORY GRID
  ====================================================== -->

  <section class="mh-home-grid">


    <!-- ===================================================
         PERSONNEL
    ==================================================== -->

    <a
      href="./personnel/"
      class="mh-home-card mh-card-personnel"
    >

      <img
        src="./main-personnel.jpg"
        alt="Personnel"
      />


      <div class="mh-card-content">

        <div>

          <div class="mh-card-number">
            01
          </div>

          <div class="mh-card-title">
            Personnel
          </div>

          <div class="mh-card-desc">
            이자헌 · 정희솔
          </div>

        </div>


        <span class="mh-card-arrow">
          ↗
        </span>

      </div>

    </a>



    <!-- ===================================================
         FRAGMENTS
    ==================================================== -->

    <a
      href="./fragments/"
      class="mh-home-card mh-card-fragments"
    >

      <img
        src="./main-fragments.jpg"
        alt="Fragments"
      />


      <div class="mh-card-content">

        <div>

          <div class="mh-card-number">
            03
          </div>

          <div class="mh-card-title">
            Fragments
          </div>

          <div class="mh-card-desc">
            written pieces
          </div>

        </div>


        <span class="mh-card-arrow">
          ↗
        </span>

      </div>

    </a>



    <!-- ===================================================
         TIMELINE
    ==================================================== -->

    <a
      href="./timeline/"
      class="mh-home-card mh-card-timeline"
    >

      <img
        src="./main-timeline.jpg"
        alt="Timeline"
      />


      <div class="mh-card-content">

        <div>

          <div class="mh-card-number">
            02
          </div>

          <div class="mh-card-title">
            Timeline
          </div>

          <div class="mh-card-desc">
            narrative sequence
          </div>

        </div>


        <span class="mh-card-arrow">
          ↗
        </span>

      </div>

    </a>



    <!-- ===================================================
         STILLS
    ==================================================== -->

    <a
      href="./stills/"
      class="mh-home-card mh-card-stills"
    >

      <img
        src="./main-stills.png"
        alt="Stills"
      />


      <div class="mh-card-content">

        <div>

          <div class="mh-card-number">
            04
          </div>

          <div class="mh-card-title">
            Stills
          </div>

          <div class="mh-card-desc">
            visual archive
          </div>

        </div>


        <span class="mh-card-arrow">
          ↗
        </span>

      </div>

    </a>


  </section>


</main>



<!-- =========================================================
     MUSIC PLAYER
========================================================= -->

<div
  class="music-player"
  id="music-player"
>

  <div class="music-left">

    <span class="music-icon">
      ♫
    </span>

    <span
      class="music-title"
      id="music-title"
    >
      긴 밤(feat. 기리보이) - Seori
    </span>

  </div>


  <div class="music-controls">

    <button
      class="music-btn small"
      onclick="prevTrack()"
      aria-label="previous track"
    >
      ‹
    </button>


    <button
      class="music-btn"
      id="music-btn"
      onclick="toggleMusic()"
      aria-label="play or pause"
    >
      ▶
    </button>


    <button
      class="music-btn small"
      onclick="nextTrack()"
      aria-label="next track"
    >
      ›
    </button>

  </div>


  <audio
    id="bgm"
    preload="metadata"
  ></audio>

</div>



<script src="./common.js"></script>


</body>

</html>

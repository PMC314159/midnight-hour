<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#0b0a10"
  />

  <title>Midnight Hour</title>


  <style>

    /* =========================================================
       FONT
    ========================================================= */

    @font-face {

      font-family: "GmarketSans";

      src:
        url("./GmarketSansTTFLight.ttf")
        format("truetype");

      font-weight: 300;

      font-style: normal;

      font-display: swap;

    }


    /* =========================================================
       ROOT
    ========================================================= */

    :root {

      --bg: #0b0a10;

      --panel: #111016;

      --text: #f1f0f5;

      --muted: rgba(241,240,245,.48);

      --line: rgba(255,255,255,.11);

      --blue: #768cff;

      --violet: #9c86ff;

      --violet-light: #bcaeff;

      --red: #cf607c;

      --radius: 25px;

    }


    /* =========================================================
       RESET
    ========================================================= */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      min-height: 100vh;

      overflow-x: hidden;

      color: var(--text);

      font-family:
        "GmarketSans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-weight: 300;

      background:

        radial-gradient(
          circle at 6% 1%,
          rgba(100,105,174,.12),
          transparent 30%
        ),

        radial-gradient(
          circle at 94% 60%,
          rgba(114,72,147,.08),
          transparent 28%
        ),

        var(--bg);

    }


    a {

      color: inherit;

      text-decoration: none;

    }


    button {

      font: inherit;

    }


    img {

      display: block;

    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width:
        min(
          1500px,
          calc(100% - 64px)
        );

      margin:
        0 auto;

      padding:
        44px
        0
        120px;

    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 40px;

      margin-bottom: 36px;

    }


    .header-left {

      min-width: 0;

    }


    .title {

      margin: 0;

      color: #f2f1f6;

      font-size:
        clamp(
          55px,
          7vw,
          112px
        );

      font-weight: 300;

      line-height: .87;

      letter-spacing: -.068em;

    }


    .subtitle {

      margin-top: 16px;

      color: rgba(178,166,226,.67);

      font-size: 11px;

      letter-spacing: .20em;

    }


    .header-track {

      display: flex;

      align-items: center;

      gap: 10px;

      padding-bottom: 8px;

      color: rgba(255,255,255,.56);

      font-size: 11px;

      white-space: nowrap;

    }


    .header-track-icon {

      color: var(--violet-light);

      font-size: 14px;

    }


    /* =========================================================
       GRID
    ========================================================= */

    .gallery {

      display: grid;

      grid-template-columns:
        1.05fr
        1.15fr
        .82fr;

      grid-template-rows:
        minmax(370px, 46vh)
        minmax(345px, 42vh);

      gap: 15px;

    }


    /* =========================================================
       CARD COMMON
    ========================================================= */

    .card {

      position: relative;

      display: block;

      overflow: hidden;

      border-radius: var(--radius);

      background: var(--panel);

      isolation: isolate;

    }


    .card-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

      transition:

        transform
        .72s
        cubic-bezier(.18,.78,.22,1),

        filter
        .45s
        ease;

    }


    /* 살짝 기본 음영 */

    .card::before {

      content: "";

      position: absolute;

      z-index: 2;

      inset: 0;

      pointer-events: none;

      background:

        linear-gradient(
          to top,
          rgba(5,5,9,.83) 0%,
          rgba(5,5,9,.14) 38%,
          transparent 63%
        );

      opacity: .34;

      transition:
        opacity
        .35s
        ease;

    }


    /* 아주 얇은 테두리 */

    .card::after {

      content: "";

      position: absolute;

      z-index: 3;

      inset: 0;

      pointer-events: none;

      border:
        1px solid
        rgba(255,255,255,.055);

      border-radius:
        inherit;

    }


    .card:hover .card-image {

      transform:
        scale(1.025);

      filter:
        brightness(.74);

    }


    .card:hover::before {

      opacity: .93;

    }


    /* =========================================================
       CARD LAYOUT
    ========================================================= */

    /*
       PERSONNEL

       위쪽 왼쪽을 크게 차지
    */

    .personnel {

      grid-column:
        1 / 3;

      grid-row:
        1;

    }


    /*
       FRAGMENTS

       왼쪽 아래
    */

    .fragments {

      grid-column:
        1;

      grid-row:
        2;

    }


    /*
       TIMELINE

       가운데 아래
    */

    .timeline {

      grid-column:
        2;

      grid-row:
        2;

    }


    /*
       STILLS

       오른쪽 전체 높이
    */

    .stills {

      grid-column:
        3;

      grid-row:
        1 / 3;

    }


    /* =========================================================
       IMAGE POSITION
    ========================================================= */

    .personnel .card-image {

      object-position:
        center
        42%;

    }


    .fragments .card-image {

      object-position:
        center
        center;

    }


    .timeline .card-image {

      object-position:
        center
        32%;

    }


    .stills .card-image {

      object-position:
        center
        center;

    }


    /* =========================================================
       CARD CONTENT
    ========================================================= */

    .card-content {

      position: absolute;

      z-index: 5;

      left: 25px;
      right: 25px;
      bottom: 23px;

      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 25px;

      pointer-events: none;

      transition:
        transform
        .34s
        ease;

    }


    .card:hover
    .card-content {

      transform:
        translateY(-3px);

    }


    .card-number {

      margin-bottom: 7px;

      color:
        rgba(255,255,255,.41);

      font-size: 9px;

      letter-spacing: .23em;

    }


    .card-title {

      color: #fff;

      font-size:
        clamp(
          20px,
          2.3vw,
          33px
        );

      font-weight: 300;

      line-height: 1;

      letter-spacing: -.045em;

    }


    .card-desc {

      overflow: hidden;

      max-height: 0;

      margin-top: 0;

      opacity: 0;

      color:
        rgba(255,255,255,.58);

      font-size: 10px;

      letter-spacing: .08em;

      transition:

        opacity
        .3s
        ease,

        max-height
        .3s
        ease,

        margin
        .3s
        ease;

    }


    .card:hover
    .card-desc {

      max-height: 26px;

      margin-top: 8px;

      opacity: 1;

    }


    /* =========================================================
       ARROW
    ========================================================= */

    .card-arrow {

      width: 40px;
      height: 40px;

      flex:
        0
        0
        auto;

      display: grid;

      place-items: center;

      border:
        1px solid
        rgba(255,255,255,.34);

      border-radius: 50%;

      color:
        rgba(255,255,255,.92);

      font-size: 16px;

      transition:

        transform
        .3s
        ease,

        background
        .3s
        ease,

        color
        .3s
        ease;

    }


    .card:hover
    .card-arrow {

      transform:
        rotate(45deg);

      background:
        rgba(255,255,255,.94);

      color:
        #15131b;

    }


    /* =========================================================
       INDIVIDUAL ACCENT
    ========================================================= */

    .personnel
    .card-number {

      color:
        rgba(139,157,255,.72);

    }


    .timeline
    .card-number {

      color:
        rgba(223,107,137,.82);

    }


    .fragments
    .card-number {

      color:
        rgba(182,161,255,.78);

    }


    .stills
    .card-number {

      color:
        rgba(164,151,224,.70);

    }


    /* =========================================================
       STILLS
    ========================================================= */

    .stills
    .card-content {

      bottom: 26px;

    }


    .stills
    .card-title {

      font-size:
        clamp(
          25px,
          2.7vw,
          38px
        );

    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;

      padding:
        25px
        5px
        0;

      color:
        rgba(255,255,255,.26);

      font-size: 9px;

      letter-spacing: .15em;

    }


    .footer-nav {

      display: flex;

      align-items: center;

      gap: 17px;

    }


    .footer-nav a {

      transition:
        color
        .2s
        ease;

    }


    .footer-nav a:hover {

      color:
        rgba(255,255,255,.78);

    }


    /* =========================================================
       MUSIC PLAYER
    ========================================================= */

    .music-player {

      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 17px;

      transform:
        translateX(-50%);

      width:
        min(
          660px,
          calc(100% - 36px)
        );

      min-height:
        61px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      padding:
        9px
        13px
        9px
        19px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius:
        999px;

      color:
        #f1f0f5;

      background:
        rgba(20,18,29,.89);

      box-shadow:
        0
        15px
        43px
        rgba(0,0,0,.32);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

    }


    .music-left,
    .music-controls {

      display: flex;

      align-items: center;

    }


    .music-left {

      min-width: 0;

      gap: 11px;

    }


    .music-icon {

      flex:
        0
        0
        auto;

      color:
        #a998ff;

      font-size: 17px;

    }


    .music-title {

      min-width: 0;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      color:
        rgba(255,255,255,.73);

      font-size: 11px;

    }


    .music-controls {

      flex:
        0
        0
        auto;

      gap: 3px;

    }


    .music-btn {

      width: 39px;
      height: 39px;

      display: grid;

      place-items: center;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,.14);

      border-radius:
        50%;

      color: white;

      background:
        rgba(255,255,255,.045);

      cursor: pointer;

      transition:
        background
        .2s
        ease;

    }


    .music-btn:hover {

      background:
        rgba(255,255,255,.10);

    }


    .music-btn.small {

      width: 31px;
      height: 31px;

      border: 0;

      background:
        transparent;

      color:
        rgba(255,255,255,.55);

      font-size: 17px;

    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media
    (max-width: 950px) {

      .page {

        width:
          calc(100% - 36px);

      }


      .gallery {

        grid-template-columns:
          1fr
          1fr;

        grid-template-rows:
          430px
          360px
          500px;

      }


      .personnel {

        grid-column:
          1 / 3;

        grid-row:
          1;

      }


      .fragments {

        grid-column:
          1;

        grid-row:
          2;

      }


      .timeline {

        grid-column:
          2;

        grid-row:
          2;

      }


      .stills {

        grid-column:
          1 / 3;

        grid-row:
          3;

      }


      .stills
      .card-image {

        object-position:
          center
          45%;

      }

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media
    (max-width: 620px) {

      .page {

        width:
          calc(100% - 24px);

        padding-top:
          28px;

      }


      .header {

        flex-direction:
          column;

        align-items:
          flex-start;

        gap: 18px;

        margin-bottom:
          24px;

      }


      .title {

        font-size:
          15vw;

      }


      .subtitle {

        margin-top:
          11px;

        font-size:
          9px;

      }


      .header-track {

        padding-bottom:
          0;

        font-size:
          10px;

      }


      .gallery {

        display: flex;

        flex-direction: column;

        gap: 11px;

      }


      .card {

        min-height: 330px;

        height: 48vh;

        border-radius: 19px;

      }


      .personnel {

        height: 43vh;

      }


      .stills {

        height: 66vh;

      }


      .card-content {

        left: 18px;
        right: 18px;
        bottom: 18px;

      }


      .card-title {

        font-size: 24px;

      }


      .card-desc {

        max-height: 25px;

        margin-top: 7px;

        opacity: .65;

      }


      .card-arrow {

        width: 36px;
        height: 36px;

      }


      .footer {

        flex-direction:
          column;

        align-items:
          flex-start;

        margin-bottom:
          62px;

      }


      .footer-nav {

        flex-wrap: wrap;

        gap:
          10px
          15px;

      }


      .music-player {

        bottom:
          10px;

        min-height:
          56px;

        padding-left:
          15px;

      }


      .music-title {

        max-width:
          170px;

        font-size:
          10px;

      }

    }

  </style>

</head>



<body>


<main
  class="page"
  id="home"
>


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="header">


    <div class="header-left">

      <h1 class="title">
        Midnight Hour
      </h1>


      <div class="subtitle">
        자정의 시간
      </div>

    </div>



    <div class="header-track">

      <span class="header-track-icon">
        ♪
      </span>

      <span>
        긴 밤(feat. 기리보이) — Seori
      </span>

    </div>


  </header>



  <!-- ======================================================
       MAIN IMAGE GRID
  ======================================================= -->

  <section class="gallery">


    <!-- ==================================================
         PERSONNEL

         main-personnel.jpg
         파란 배경의 두 사람 가로 일러스트
    =================================================== -->

    <a
      href="./personnel/"
      class="card personnel"
      aria-label="Personnel"
    >


      <img
        class="card-image"
        src="./main-personnel.jpg"
        alt="이자헌과 정희솔"
      />


      <div class="card-content">


        <div>

          <div class="card-number">
            01
          </div>


          <div class="card-title">
            Personnel
          </div>


          <div class="card-desc">
            이자헌 · 정희솔
          </div>

        </div>



        <span class="card-arrow">
          ↗
        </span>


      </div>


    </a>



    <!-- ==================================================
         FRAGMENTS

         main-fragments.jpg
         보라빛 클로즈업 일러스트
    =================================================== -->

    <a
      href="./fragments/"
      class="card fragments"
      aria-label="Fragments"
    >


      <img
        class="card-image"
        src="./main-fragments.jpg"
        alt="Fragments"
      />


      <div class="card-content">


        <div>

          <div class="card-number">
            03
          </div>


          <div class="card-title">
            Fragments
          </div>


          <div class="card-desc">
            written pieces
          </div>

        </div>



        <span class="card-arrow">
          ↗
        </span>


      </div>


    </a>



    <!-- ==================================================
         TIMELINE

         main-timeline.jpg
         빨강 + 검정 일러스트
    =================================================== -->

    <a
      href="./timeline/"
      class="card timeline"
      aria-label="Narrative Timeline"
    >


      <img
        class="card-image"
        src="./main-timeline.jpg"
        alt="Narrative Timeline"
      />


      <div class="card-content">


        <div>

          <div class="card-number">
            02
          </div>


          <div class="card-title">
            Timeline
          </div>


          <div class="card-desc">
            narrative sequence
          </div>

        </div>



        <span class="card-arrow">
          ↗
        </span>


      </div>


    </a>



    <!-- ==================================================
         STILLS

         main-stills.png

         네가 말한
         '아까 보낸 다섯 번째 이미지'
         = 수이님 1주년 일러스트
    =================================================== -->

    <a
      href="./commission/"
      class="card stills"
      aria-label="Stills"
    >


      <img
        class="card-image"
        src="./main-stills.png"
        alt="Stills"
      />


      <div class="card-content">


        <div>

          <div class="card-number">
            04
          </div>


          <div class="card-title">
            Stills
          </div>


          <div class="card-desc">
            visual archive
          </div>

        </div>



        <span class="card-arrow">
          ↗
        </span>


      </div>


    </a>


  </section>



  <!-- ======================================================
       FOOTER
  ======================================================= -->

  <footer class="footer">


    <div>
      MIDNIGHT HOUR · PERSONAL PAIR ARCHIVE
    </div>


    <nav class="footer-nav">

      <a href="./personnel/">
        PERSONNEL
      </a>

      <a href="./timeline/">
        TIMELINE
      </a>

      <a href="./fragments/">
        FRAGMENTS
      </a>

      <a href="./commission/">
        STILLS
      </a>

    </nav>


  </footer>


</main>



<!-- ========================================================
     MUSIC PLAYER

     기존 common.js를 그대로 사용한다.
========================================================= -->

<div
  class="music-player"
  id="music-player"
>


  <div class="music-left">


    <span class="music-icon">
      ♫
    </span>


    <span
      class="music-title"
      id="music-title"
    >
      긴 밤(feat. 기리보이) - Seori
    </span>


  </div>



  <div class="music-controls">


    <button
      aria-label="previous track"
      class="music-btn small"
      onclick="prevTrack()"
    >
      ‹
    </button>


    <button
      aria-label="play or pause"
      class="music-btn"
      id="music-btn"
      onclick="toggleMusic()"
    >
      ▶
    </button>


    <button
      aria-label="next track"
      class="music-btn small"
      onclick="nextTrack()"
    >
      ›
    </button>


  </div>



  <audio
    id="bgm"
    preload="metadata"
  ></audio>


</div>



<!-- 기존 naru의 common.js 그대로 사용 -->

<script src="./common.js"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Fragments | Midnight Hour</title>


  <style>

    @font-face {
      font-family: "GmarketSans";
      src: url("../GmarketSansTTFLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      min-height: 100vh;

      color: #f2f1f6;

      font-family:
        "GmarketSans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 85% 0%,
          rgba(94,73,163,.14),
          transparent 32%
        ),
        radial-gradient(
          circle at 8% 88%,
          rgba(70,94,177,.07),
          transparent 29%
        ),
        #08080d;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button {
      font: inherit;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .mh-fr-page {
      width: min(1100px, calc(100% - 54px));

      margin: 0 auto;

      padding:
        38px
        0
        145px;
    }


    /* =========================================================
       TOP
    ========================================================= */

    .mh-fr-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding-bottom: 22px;

      border-bottom:
        1px solid
        rgba(255,255,255,.10);
    }


    .mh-fr-back {
      color: rgba(255,255,255,.56);

      font-size: 11px;

      letter-spacing: .14em;

      transition:
        color .2s ease,
        transform .2s ease;
    }


    .mh-fr-back:hover {
      color: white;

      transform: translateX(-3px);
    }


    .mh-fr-index {
      color: rgba(176,162,235,.7);

      font-size: 10px;

      letter-spacing: .23em;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .mh-fr-header {
      padding:
        62px
        0
        68px;
    }


    .mh-fr-kicker {
      margin-bottom: 12px;

      color: #b8a7ff;

      font-size: 11px;

      letter-spacing: .25em;
    }


    .mh-fr-title {
      margin: 0;

      font-size:
        clamp(
          58px,
          8vw,
          103px
        );

      line-height: .9;

      letter-spacing: -.065em;

      font-weight: 300;
    }


    .mh-fr-title span {
      color: rgba(255,255,255,.34);
    }


    .mh-fr-sub {
      margin-top: 20px;

      color: rgba(255,255,255,.36);

      font-size: 10px;

      letter-spacing: .14em;
    }


    /* =========================================================
       CARDS
    ========================================================= */

    .mh-fr-list {
      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .mh-fr-card {
      width: 100%;

      min-height: 150px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;

      padding:
        32px
        40px;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius: 30px;

      color: inherit;

      text-align: left;

      background:
        rgba(255,255,255,.012);

      cursor: pointer;

      transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease;
    }


    .mh-fr-card:hover {
      transform: translateY(-2px);

      border-color:
        rgba(174,155,255,.30);

      background:
        linear-gradient(
          100deg,
          rgba(116,90,190,.055),
          rgba(255,255,255,.013)
        );
    }


    .mh-fr-card-title {
      margin: 0;

      color: #efedf8;

      font-size:
        clamp(
          22px,
          2.4vw,
          30px
        );

      font-weight: 300;

      line-height: 1.3;

      letter-spacing: -.035em;
    }


    .mh-fr-card-subtitle {
      margin-top: 17px;

      color: #b8c7ff;

      font-size:
        clamp(
          14px,
          1.6vw,
          18px
        );

      line-height: 1.7;

      word-break: keep-all;
    }


    .mh-fr-card:nth-child(2)
    .mh-fr-card-subtitle {
      color: #b8b0ff;
    }


    .mh-fr-card:nth-child(3)
    .mh-fr-card-subtitle {
      color: #d29dcb;
    }


    .mh-fr-card:nth-child(4)
    .mh-fr-card-subtitle {
      color: #d68da3;
    }


    /* =========================================================
       READER MODAL
    ========================================================= */

    .mh-fr-modal {
      position: fixed;

      z-index: 500;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 28px;

      background:
        rgba(3,3,7,.91);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }


    .mh-fr-modal.open {
      display: flex;
    }


    .mh-fr-reader {
      width: min(820px, 100%);

      max-height: 87vh;

      overflow-y: auto;

      padding:
        46px
        48px
        52px;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius: 30px;

      background: #101016;

      box-shadow:
        0
        28px
        80px
        rgba(0,0,0,.38);
    }


    .mh-fr-reader-head {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 28px;

      margin-bottom: 31px;

      padding-bottom: 25px;

      border-bottom:
        1px solid
        rgba(255,255,255,.09);
    }


    .mh-fr-reader-heading {
      min-width: 0;
    }


    .mh-fr-reader-title {
      margin: 0;

      color: #f1eff7;

      font-size: 29px;

      font-weight: 300;

      letter-spacing: -.04em;
    }


    .mh-fr-reader-subtitle {
      margin-top: 9px;

      color: rgba(183,172,244,.67);

      font-size: 12px;

      line-height: 1.7;

      word-break: keep-all;
    }


    .mh-fr-close {
      flex: 0 0 auto;

      padding:
        7px
        0;

      border: 0;

      color: rgba(255,255,255,.48);

      background: transparent;

      cursor: pointer;

      font-size: 9px;

      letter-spacing: .17em;
    }


    .mh-fr-close:hover {
      color: white;
    }


    /* =========================================================
       TEXT CONTENT
    ========================================================= */

    .mh-fr-reader-text {
      color: rgba(255,255,255,.78);

      font-size: 15px;

      line-height: 2.15;

      word-break: keep-all;

      white-space: pre-wrap;
    }


    /*
      fragment3.html처럼 HTML을 불러올 때
    */

    .mh-fr-reader-text.is-html {
      white-space: normal;
    }


    .mh-fr-reader-text.is-html p {
      margin:
        0
        0
        1.35em;
    }


    .mh-fr-reader-text.is-html p:last-child {
      margin-bottom: 0;
    }


    /*
      기울임체
    */

    .mh-fr-reader-text em {
      color: rgba(215,207,255,.90);

      font-style: italic;
    }


    /* =========================================================
       MUSIC
    ========================================================= */

    .music-player {
      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 17px;

      transform: translateX(-50%);

      width:
        min(
          660px,
          calc(100% - 36px)
        );

      min-height: 61px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding:
        9px
        13px
        9px
        19px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 999px;

      background:
        rgba(20,18,29,.89);

      box-shadow:
        0
        15px
        43px
        rgba(0,0,0,.32);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }


    .music-left,
    .music-controls {
      display: flex;
      align-items: center;
    }


    .music-left {
      min-width: 0;
      gap: 11px;
    }


    .music-icon {
      color: #a998ff;
      font-size: 17px;
    }


    .music-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      color: rgba(255,255,255,.72);

      font-size: 11px;
    }


    .music-controls {
      flex: 0 0 auto;
      gap: 3px;
    }


    .music-btn {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,.14);

      border-radius: 50%;

      color: white;

      background:
        rgba(255,255,255,.045);

      cursor: pointer;
    }


    .music-btn.small {
      width: 31px;
      height: 31px;

      border: 0;

      background: transparent;

      color: rgba(255,255,255,.55);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 650px) {

      .mh-fr-page {
        width: calc(100% - 28px);
      }


      .mh-fr-header {
        padding:
          48px
          0
          50px;
      }


      .mh-fr-card {
        min-height: 130px;

        padding:
          28px
          25px;

        border-radius: 23px;
      }


      .mh-fr-card-title {
        font-size: 23px;
      }


      .mh-fr-card-subtitle {
        margin-top: 12px;

        font-size: 14px;
      }


      .mh-fr-modal {
        padding: 13px;
      }


      .mh-fr-reader {
        padding:
          31px
          24px
          38px;

        border-radius: 22px;
      }


      .mh-fr-reader-title {
        font-size: 24px;
      }


      .mh-fr-reader-text {
        font-size: 13.5px;

        line-height: 2;
      }

    }

  </style>

</head>


<body>


<main class="mh-fr-page">


  <nav class="mh-fr-top">

    <a
      class="mh-fr-back"
      href="../index.html"
    >
      ← BACK TO MAIN
    </a>

    <span class="mh-fr-index">
      03 · FRAGMENTS
    </span>

  </nav>



  <header class="mh-fr-header">

    <div class="mh-fr-kicker">
      WRITTEN PIECES
    </div>

    <h1 class="mh-fr-title">
      Fragment<span>s.</span>
    </h1>

    <div class="mh-fr-sub">
      SCENES · NOTES · MOMENTS
    </div>

  </header>



  <!-- =====================================================
       FRAGMENT CARDS
  ====================================================== -->

  <section class="mh-fr-list">


    <!-- 001 -->

    <button
      class="mh-fr-card"
      onclick="openFragment({
        file: 'fragment1.txt',
        type: 'text',
        title: 'Fragment 001',
        subtitle: '—'
      })"
    >

      <h2 class="mh-fr-card-title">
        Fragment 001
      </h2>

      <div class="mh-fr-card-subtitle">
        —
      </div>

    </button>



    <!-- 002 -->

    <button
      class="mh-fr-card"
      onclick="openFragment({
        file: 'fragment2.txt',
        type: 'text',
        title: 'Fragment 002',
        subtitle: '자정'
      })"
    >

      <h2 class="mh-fr-card-title">
        Fragment 002
      </h2>

      <div class="mh-fr-card-subtitle">
        자정
      </div>

    </button>



    <!-- 003 -->

    <button
      class="mh-fr-card"
      onclick="openFragment({
        file: 'fragment3.html',
        type: 'html',
        title: 'Fragment 003',
        subtitle: '흰담비 씨는 저를 좋아합니까?'
      })"
    >

      <h2 class="mh-fr-card-title">
        Fragment 003
      </h2>

      <div class="mh-fr-card-subtitle">
        흰담비 씨는 저를 좋아합니까?
      </div>

    </button>



    <!-- 004 -->

    <button
      class="mh-fr-card"
      onclick="openFragment({
        file: 'fragment4.txt',
        type: 'text',
        title: 'Fragment 004',
        subtitle: '一命還君 : 당신이 구해준 한 목숨을 당신에게 돌려드리겠습니다.'
      })"
    >

      <h2 class="mh-fr-card-title">
        Fragment 004
      </h2>

      <div class="mh-fr-card-subtitle">
        一命還君 : 당신이 구해준 한 목숨을 당신에게 돌려드리겠습니다.
      </div>

    </button>


  </section>


</main>



<!-- =========================================================
     READER
========================================================= -->

<div
  class="mh-fr-modal"
  id="mh-fr-modal"
  onclick="closeFragmentOutside(event)"
>

  <article class="mh-fr-reader">


    <div class="mh-fr-reader-head">


      <div class="mh-fr-reader-heading">

        <h2
          class="mh-fr-reader-title"
          id="mh-fr-reader-title"
        >
          Fragment
        </h2>

        <div
          class="mh-fr-reader-subtitle"
          id="mh-fr-reader-subtitle"
        >
        </div>

      </div>


      <button
        class="mh-fr-close"
        onclick="closeFragment()"
      >
        CLOSE
      </button>


    </div>


    <div
      class="mh-fr-reader-text"
      id="mh-fr-reader-text"
    >
      Loading...
    </div>


  </article>

</div>



<!-- =========================================================
     MUSIC
========================================================= -->

<div
  class="music-player"
  id="music-player"
>

  <div class="music-left">

    <span class="music-icon">
      ♫
    </span>

    <span
      class="music-title"
      id="music-title"
    >
      긴 밤(feat. 기리보이) - Seori
    </span>

  </div>


  <div class="music-controls">

    <button
      aria-label="previous track"
      class="music-btn small"
      onclick="prevTrack()"
    >
      ‹
    </button>

    <button
      aria-label="play or pause"
      class="music-btn"
      id="music-btn"
      onclick="toggleMusic()"
    >
      ▶
    </button>

    <button
      aria-label="next track"
      class="music-btn small"
      onclick="nextTrack()"
    >
      ›
    </button>

  </div>


  <audio
    id="bgm"
    preload="metadata"
  ></audio>

</div>



<script src="../common.js"></script>


<script>

  const fragmentModal =
    document.getElementById(
      "mh-fr-modal"
    );


  const fragmentTitle =
    document.getElementById(
      "mh-fr-reader-title"
    );


  const fragmentSubtitle =
    document.getElementById(
      "mh-fr-reader-subtitle"
    );


  const fragmentText =
    document.getElementById(
      "mh-fr-reader-text"
    );



  async function openFragment(data) {

    fragmentTitle.textContent =
      data.title;


    fragmentSubtitle.textContent =
      data.subtitle || "";


    fragmentText.classList.remove(
      "is-html"
    );


    fragmentText.textContent =
      "Loading...";


    fragmentModal.classList.add(
      "open"
    );


    document.body.style.overflow =
      "hidden";


    try {

      const response =
        await fetch(data.file);


      if (!response.ok) {

        throw new Error(
          "Failed to load fragment."
        );

      }


      const content =
        await response.text();


      if (
        data.type === "html"
      ) {

        fragmentText.classList.add(
          "is-html"
        );


        fragmentText.innerHTML =
          content;

      }

      else {

        fragmentText.textContent =
          content;

      }

    }

    catch (error) {

      fragmentText.textContent =
        "글을 불러오지 못했습니다.\n\n" +
        data.file +
        " 파일이 fragments 폴더 안에 있는지 확인해 주세요.";

    }

  }



  function closeFragment() {

    fragmentModal.classList.remove(
      "open"
    );


    document.body.style.overflow =
      "";

  }



  function closeFragmentOutside(event) {

    if (
      event.target === fragmentModal
    ) {

      closeFragment();

    }

  }



  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        fragmentModal.classList.contains("open")
      ) {

        closeFragment();

      }

    }
  );

</script>


</body>
</html>

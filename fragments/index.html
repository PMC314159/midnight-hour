<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Fragments | Midnight Hour</title>

  <style>

    @font-face {
      font-family: "GmarketSans";
      src: url("../GmarketSansTTFLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }


    :root {
      --bg: #08080d;
      --text: #f2f1f6;

      --purple: #9783ee;
      --purple-mid: #aa9bef;
      --purple-light: #c0b5f6;
      --purple-soft: #b7abf4;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      min-height: 100vh;

      color: var(--text);

      font-family:
        "GmarketSans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-weight: 300;

      background:
        radial-gradient(
          circle at 88% 8%,
          rgba(86, 77, 158, .14),
          transparent 33%
        ),
        radial-gradient(
          circle at 5% 80%,
          rgba(74, 95, 180, .07),
          transparent 28%
        ),
        var(--bg);
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button {
      font: inherit;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .mh-fr-page {
      width:
        min(
          1100px,
          calc(100% - 54px)
        );

      margin: 0 auto;

      padding:
        38px
        0
        145px;
    }


    /* =========================================================
       TOP
    ========================================================= */

    .mh-fr-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 30px;

      padding-bottom: 22px;

      border-bottom:
        1px solid
        rgba(255,255,255,.10);
    }


    .mh-fr-back {
      color:
        rgba(255,255,255,.60);

      font-size: 12px;

      letter-spacing: .14em;

      transition:
        color .2s ease,
        transform .2s ease;
    }


    .mh-fr-back:hover {
      color: white;

      transform:
        translateX(-3px);
    }


    .mh-fr-index {
      color:
        rgba(184,172,241,.76);

      font-size: 11px;

      letter-spacing: .23em;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .mh-fr-header {
      padding:
        58px
        0
        62px;
    }


    .mh-fr-kicker {
      margin-bottom: 13px;

      color:
        #b8a7ff;

      font-size: 12px;

      letter-spacing: .25em;
    }


    .mh-fr-title {
      margin: 0;

      font-size:
        clamp(
          60px,
          8vw,
          104px
        );

      line-height: .9;

      letter-spacing: -.065em;

      font-weight: 300;
    }


    .mh-fr-title span {
      color:
        rgba(255,255,255,.34);
    }


    .mh-fr-sub {
      margin-top: 22px;

      color:
        rgba(255,255,255,.42);

      font-size: 11px;

      letter-spacing: .15em;
    }


    /* =========================================================
       CARDS
    ========================================================= */

    .mh-fr-list {
      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .mh-fr-card {
      width: 100%;

      min-height: 155px;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: flex-start;

      padding:
        34px
        42px;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius: 29px;

      color: inherit;

      text-align: left;

      background:
        linear-gradient(
          100deg,
          rgba(113,85,190,.025),
          rgba(255,255,255,.012)
        );

      cursor: pointer;

      transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease;
    }


    .mh-fr-card:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(184,166,255,.32);

      background:
        linear-gradient(
          100deg,
          rgba(116,90,190,.07),
          rgba(255,255,255,.015)
        );
    }


    .mh-fr-card-title {
      margin: 0;

      color:
        #f0eef8;

      font-size:
        clamp(
          26px,
          2.7vw,
          34px
        );

      font-weight: 300;

      line-height: 1.25;

      letter-spacing: -.04em;
    }


    .mh-fr-card-subtitle {
      margin-top: 17px;

      color:
        var(--purple-soft);

      font-size:
        clamp(
          17px,
          1.7vw,
          20px
        );

      line-height: 1.65;

      word-break: keep-all;
    }


    /* =========================================================
       MODAL
    ========================================================= */

    .mh-fr-modal {
      position: fixed;

      z-index: 500;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 28px;

      background:
        rgba(3,3,7,.91);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      cursor: pointer;
    }


    .mh-fr-modal.open {
      display: flex;
    }


    /* =========================================================
       READER
    ========================================================= */

    .mh-fr-reader {
      width:
        min(
          860px,
          100%
        );

      max-height: 88vh;

      overflow-y: auto;

      padding:
        48px
        52px
        56px;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius: 30px;

      background:
        #101016;

      box-shadow:
        0
        28px
        80px
        rgba(0,0,0,.38);

      scrollbar-width: thin;

      scrollbar-color:
        rgba(160,139,239,.35)
        transparent;

      cursor: default;
    }


    .mh-fr-reader::-webkit-scrollbar {
      width: 7px;
    }


    .mh-fr-reader::-webkit-scrollbar-track {
      background: transparent;
    }


    .mh-fr-reader::-webkit-scrollbar-thumb {
      border-radius: 999px;

      background:
        rgba(160,139,239,.32);
    }


    /* =========================================================
       READER HEADER
    ========================================================= */

    .mh-fr-reader-head {
      margin-bottom: 34px;

      padding-bottom: 27px;

      border-bottom:
        1px solid
        rgba(255,255,255,.09);
    }


    .mh-fr-reader-title {
      margin: 0;

      color:
        #f2f0f8;

      font-size: 34px;

      font-weight: 300;

      line-height: 1.2;

      letter-spacing: -.045em;
    }


    .mh-fr-reader-subtitle {
      margin-top: 11px;

      color:
        var(--purple-soft);

      font-size: 16px;

      line-height: 1.7;

      word-break: keep-all;
    }


    /* =========================================================
       READER BODY
    ========================================================= */

    .mh-fr-reader-text {
      color:
        rgba(255,255,255,.84);

      font-size: 17px;

      line-height: 2.15;

      letter-spacing: -.01em;

      word-break: keep-all;

      white-space: pre-wrap;
    }


    .mh-fr-reader-text.is-html {
      white-space: normal;
    }


    .mh-fr-reader-text.is-html p {
      margin:
        0
        0
        1.55em;
    }


    .mh-fr-reader-text.is-html p:last-child {
      margin-bottom: 0;
    }


    .mh-fr-reader-text em {
      color:
        #c8bcfa;

      font-style: italic;
    }


    /* =========================================================
       MUSIC
    ========================================================= */

    .music-player {
      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 17px;

      transform:
        translateX(-50%);

      width:
        min(
          660px,
          calc(100% - 36px)
        );

      min-height: 61px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding:
        9px
        13px
        9px
        19px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 999px;

      background:
        rgba(20,18,29,.89);

      box-shadow:
        0
        15px
        43px
        rgba(0,0,0,.32);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    .music-left,
    .music-controls {
      display: flex;
      align-items: center;
    }


    .music-left {
      min-width: 0;

      gap: 11px;
    }


    .music-icon {
      color:
        #a998ff;

      font-size: 17px;
    }


    .music-title {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      color:
        rgba(255,255,255,.72);

      font-size: 11px;
    }


    .music-controls {
      flex:
        0
        0
        auto;

      gap: 3px;
    }


    .music-btn {
      width: 39px;
      height: 39px;

      display: grid;

      place-items: center;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,.14);

      border-radius: 50%;

      color: white;

      background:
        rgba(255,255,255,.045);

      cursor: pointer;
    }


    .music-btn.small {
      width: 31px;
      height: 31px;

      border: 0;

      background:
        transparent;

      color:
        rgba(255,255,255,.55);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 650px) {

      .mh-fr-page {
        width:
          calc(100% - 28px);
      }


      .mh-fr-header {
        padding:
          46px
          0
          48px;
      }


      .mh-fr-title {
        font-size:
          17vw;
      }


      .mh-fr-card {
        min-height: 135px;

        padding:
          29px
          25px;

        border-radius: 23px;
      }


      .mh-fr-card-title {
        font-size: 25px;
      }


      .mh-fr-card-subtitle {
        margin-top: 13px;

        font-size: 16px;
      }


      .mh-fr-modal {
        padding: 12px;
      }


      .mh-fr-reader {
        padding:
          32px
          25px
          40px;

        border-radius: 22px;

        max-height: 91vh;
      }


      .mh-fr-reader-head {
        margin-bottom: 26px;

        padding-bottom: 21px;
      }


      .mh-fr-reader-title {
        font-size: 27px;
      }


      .mh-fr-reader-subtitle {
        font-size: 14px;
      }


      .mh-fr-reader-text {
        font-size: 15px;

        line-height: 2;
      }

    }

  </style>

</head>


<body>


<main class="mh-fr-page">


  <nav class="mh-fr-top">

    <a
      class="mh-fr-back"
      href="../index.html"
    >
      ← BACK TO MAIN
    </a>

    <span class="mh-fr-index">
      03 · FRAGMENTS
    </span>

  </nav>



  <header class="mh-fr-header">

    <div class="mh-fr-kicker">
      WRITTEN PIECES
    </div>

    <h1 class="mh-fr-title">
      Fragment<span>s.</span>
    </h1>

    <div class="mh-fr-sub">
      SCENES · NOTES · MOMENTS
    </div>

  </header>



  <section class="mh-fr-list">


    <!-- 001 -->

    <button
      class="mh-fr-card"
      onclick="openFragmentText(
        'fragment1.txt',
        'Fragment 001',
        '자정'
      )"
    >

      <h2 class="mh-fr-card-title">
        Fragment 001
      </h2>

      <div class="mh-fr-card-subtitle">
        자정
      </div>

    </button>



    <!-- 002 -->

    <button
      class="mh-fr-card"
      onclick="openFragmentText(
        'fragment2.txt',
        'Fragment 002',
        '자정'
      )"
    >

      <h2 class="mh-fr-card-title">
        Fragment 002
      </h2>

      <div class="mh-fr-card-subtitle">
        자정
      </div>

    </button>



    <!-- 003 -->

    <button
      class="mh-fr-card"
      onclick="openFragmentThree()"
    >

      <h2 class="mh-fr-card-title">
        Fragment 003
      </h2>

      <div class="mh-fr-card-subtitle">
        소원
      </div>

    </button>



    <!-- 004 -->

    <button
      class="mh-fr-card"
      onclick="openFragmentText(
        'fragment4.txt',
        'Fragment 004',
        '一命還君 : 당신이 구해준 한 목숨을 당신에게 돌려드리겠습니다.'
      )"
    >

      <h2 class="mh-fr-card-title">
        Fragment 004
      </h2>

      <div class="mh-fr-card-subtitle">
        一命還君 : 당신이 구해준 한 목숨을 당신에게 돌려드리겠습니다.
      </div>

    </button>


  </section>


</main>



<!-- =========================================================
     READER MODAL
     CLOSE 버튼 없음
========================================================= -->

<div
  class="mh-fr-modal"
  id="mh-fr-modal"
  onclick="closeFragment()"
>

  <article
    class="mh-fr-reader"
    onclick="event.stopPropagation()"
  >


    <div class="mh-fr-reader-head">

      <h2
        class="mh-fr-reader-title"
        id="mh-fr-reader-title"
      >
        Fragment
      </h2>


      <div
        class="mh-fr-reader-subtitle"
        id="mh-fr-reader-subtitle"
      >
      </div>

    </div>


    <div
      class="mh-fr-reader-text"
      id="mh-fr-reader-text"
    >
      Loading...
    </div>


  </article>

</div>



<!-- =========================================================
     FRAGMENT 003
========================================================= -->

<template id="fragment-three-template">

  <p>
    흰담비 씨는 저를 좋아합니까?<br>
    좋아하죠, 당연히.<br>
    그렇다면 제가 당신의 연인이 될 수 없던 이유는 무엇입니까?
  </p>

  <p>
    그 질문에 여자가 어떤 표정을 지었더라.
  </p>

  <p>
    기상 시각 사택의 기온은 낮다.
    일반적인 인간 개체의 기준으로도 낮은 편이다.
    여자는 아침에 일어날 때면 늘 이불 밖으로 나오려 하지 않았으므로.
    <em>추워요.</em>
    여자가 잠결에 그런 말을 흘릴 때면 그는 늘 똑같이 답했다.
    아닙니다. 현재 기온은 이십일 도씨로, 흰담비 씨가 취침 전 맞춘 에어컨의 기온입니다.
    그 말에 여자 또한 똑같이 답했다.
    <em>원래 일어날 때면 춥게 느껴지고 이불 덮으면 따뜻한 게 최고인 거예요….</em>
    그로썬 이해되지 않고 논리적이지 않은 소리였다.
  </p>

  <p>
    다시 생각해보니 일반적이라는 말 또한 논리적이지 않았다.
    그의 사택에서 아침을 맞이한 인간 개체는 한 명 뿐이었으므로.
  </p>

  <p>
    기름을 두 바퀴 둘러 계란 두 개를 구웠다.
    여자는 늘 기름을 두 바퀴 이상 두른 뒤 뒤집지 않고 오래 구워 바삭바삭해진 반숙을 선호했다.
    여자가 그러했듯 노른자를 터뜨려 밥에 비볐다.
    바삭한 계란 흰자가 입 안에서 부서졌다.
  </p>

  <p>
    운전대에 힘을 최대한 주지 않았다.
    힘을 조절하기 어려웠다.
    출퇴근 길의 운전은 늘 여자의 몫이었다.
    그가 운전대를 두 번 부러뜨린 뒤 다시 나타난 여자는
    면허를 땄다며 당당하게 운전면허증을 그에게 들이밀었다.
    그 뒤로 그는 한참 운전대를 잡은 적이 없었다.
  </p>

  <p>
    점심 후 카페에서 구매한 음료는 쿠키쉐이크였다.
    여자가 늘 주문하던 메뉴였다.
    쿠키 조각이 입 안에서 씹히는 게 마음에 든다고 했다.
    음료를 마실 때면 여자의 입이 조금씩 우물거렸다.
    여자는 입이 작은 편이라 음료를 전부 마시는 데에 남들보다 시간이 오래 걸렸다.
    여자가 그러했듯 음료를 입에 머금은 뒤 쿠키 조각을 씹었다.
    알갱이가 잘게 부서졌다.
  </p>

  <p>
    퇴근 후 디비디 플레이어로 재생할 영화를 고르지 못했다.
    선택은 늘 여자의 몫이었기 때문이다.
    그 스스로도 모르는 기호를 맞추려 애쓰며,
    그러면서도 여자 본인의 취향을 벗어나지 않도록.
    가장 마지막으로 여자와 함께 보았던 영화를 틀었다.
    오늘로 정확히 쉰한 번째의 재생이었다.
  </p>

  <p>
    주인없는 방의 기온과 에어컨의 설정된 온도를 확인했다.
    여자가 늘 맞춰놓고 취침하던 기온이었다.
    불을 끄려다 말고 방의 책상 한구석에 놓인
    짙푸른 손목시계 옆 실팔찌를 집어들었다.
  </p>

  <p>
    <em>끊어지면 소원이 이루어지는 거예요.</em>
    증명된 사실입니까?
    <em>사실 끊어진 적이 없어서 모르겠어요.</em>
    그렇다면 흰담비 씨가 확신하는 이유는 무엇입니까?
    <em>끊어지면 알게 되지 않을까요? 이루어지는지 아닌지.</em>
  </p>

  <p>
    그렇게 말했음에도 막상 잘 차고 다니지 않아,
    여자의 팔찌는 조금도 닳지 않은 상태였다.
    그가 늘 방의 청결을 유지했으므로,
    먼지 또한 묻지 않았다.
    팔찌 한쪽을 쥐고 반대편에 검지를 걸었다.
    이대로 당기면 끊어질 터다.
    그에겐 조금의 힘도 필요하지 않은 일이었다.
  </p>

  <p>
    끊어지면 소원이 이루어지는지 알 수 있다고 했나.
  </p>

  <p>
    그렇다면 어떤 소원을 빌어야 당신이 눈을 뜰까.
  </p>

</template>



<!-- =========================================================
     MUSIC PLAYER
========================================================= -->

<div
  class="music-player"
  id="music-player"
>

  <div class="music-left">

    <span class="music-icon">
      ♫
    </span>

    <span
      class="music-title"

      ▶
    </button>

    <button
      class="music-btn small"
      onclick="nextTrack()"
      aria-label="next track"
    >
      ›
    </button>

  </div>


  <audio
    id="bgm"
    preload="metadata"
  ></audio>

</div>



<script src="../common.js"></script>


<script>

  const fragmentModal =
    document.getElementById(
      "mh-fr-modal"
    );


  const fragmentTitle =
    document.getElementById(
      "mh-fr-reader-title"
    );


  const fragmentSubtitle =
    document.getElementById(
      "mh-fr-reader-subtitle"
    );


  const fragmentText =
    document.getElementById(
      "mh-fr-reader-text"
    );



  function prepareFragment(
    title,
    subtitle
  ) {

    fragmentTitle.textContent =
      title;


    fragmentSubtitle.textContent =
      subtitle;


    fragmentText.innerHTML =
      "";


    fragmentText.classList.remove(
      "is-html"
    );


    fragmentModal.classList.add(
      "open"
    );


    document.body.style.overflow =
      "hidden";

  }



  async function openFragmentText(
    file,
    title,
    subtitle
  ) {

    prepareFragment(
      title,
      subtitle
    );


    fragmentText.textContent =
      "Loading...";


    try {

      const response =
        await fetch(file);


      if (!response.ok) {

        throw new Error(
          "Failed to load fragment."
        );

      }


      const content =
        await response.text();


      fragmentText.textContent =
        content;

    }


    catch (error) {

      fragmentText.textContent =
        "글을 불러오지 못했습니다.\n\n" +
        file +
        " 파일이 fragments 폴더 안에 있는지 확인해 주세요.";

    }

  }



  function openFragmentThree() {

    prepareFragment(
      "Fragment 003",
      "소원"
    );


    const template =
      document.getElementById(
        "fragment-three-template"
      );


    fragmentText.classList.add(
      "is-html"
    );


    fragmentText.appendChild(
      template.content.cloneNode(true)
    );

  }



  function closeFragment() {

    fragmentModal.classList.remove(
      "open"
    );


    document.body.style.overflow =
      "";

  }



  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        fragmentModal.classList.contains(
          "open"
        )
      ) {

        closeFragment();

      }

    }
  );

</script>
